steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/football-api:$COMMIT_SHA'
      - '-f'
      - 'apps/api/Dockerfile'
      - 'apps/api'

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'football-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/football-api:$COMMIT_SHA'
      - '--region'
      - 'asia-northeast3'
      - '--platform'
      - 'managed'

images:
  - 'gcr.io/$PROJECT_ID/football-api:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
