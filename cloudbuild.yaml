steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/football-api:$COMMIT_SHA'
      - '-f'
      - 'apps/api/Dockerfile'
      - 'apps/api'

images:
  - 'gcr.io/$PROJECT_ID/football-api:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
