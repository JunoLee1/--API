worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Docker's embedded DNS resolves `api` to all container IPs of the scaled
  # `api` service. Nginx picks one per request (round-robin by default).
  upstream backend {
    server api:3001 max_fails=3 fail_timeout=30s;
  }

  # Extended log format including selected upstream + upstream status.
  log_format lb '$remote_addr → $upstream_addr [$upstream_status] '
                '"$request" $status $body_bytes_sent '
                'rt=$request_time ut=$upstream_response_time';
  access_log /var/log/nginx/access.log lb;

  # Reasonable defaults for a load-test target.
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 10m;

  server {
    listen 80;
    server_name _;

    # nginx-level healthcheck (does not hit upstreams).
    location = /lb-health {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Expose which upstream served this request — k6 script consumes it
      # to compute per-replica distribution.
      add_header X-Upstream $upstream_addr always;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}
